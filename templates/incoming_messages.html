{% extends "homepage.html" %} {% block styles %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/incomingmessages.css') }}"
/>
{% endblock %} {% block content %}
<div class="incoming-container">
  <div class="page-header">
    <h2>Incoming Messages</h2>
    <p>
      <span id="unread-count">0</span> unread ·
      <span id="total-count">0</span> total
    </p>
  </div>

  <div class="toolbar">
    <input id="searchBox" class="search-box" placeholder="Search messages..." />
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="whatsapp">WhatsApp</button>
      <button class="filter-btn" data-filter="telegram">Telegram</button>
      <button class="filter-btn" data-filter="messenger">Messenger</button>
      <button class="filter-btn" data-filter="instagram">Instagram</button>
    </div>
  </div>

  <div class="message-list" id="message-list">
    <!-- Populate dynamically -->

  </div>
</div>
<script src="{{ url_for('static', filename='js/incomingmessages.js') }}"></script>
{% endblock %}
